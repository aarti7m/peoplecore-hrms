{% extends 'hrms/base.html' %}
{% block title %}Department Form | PeopleCore{% endblock %}
{% block content %}<div class="page-head"><div><h1>{% if department %}Edit Department{% else %}Add Department{% endif %}</h1><p>Maintain department information.</p></div></div><form method="post" data-validate novalidate>{% csrf_token %}<div class="panel form-panel"><div class="panel-body"><div class="form-grid"><div class="field"><label>Department name</label><input class="form-control" name="name" value="{{ department.name }}" required><div class="invalid-feedback">Department name is required.</div></div><div class="field"><label>Status</label><select class="form-control" name="status"><option>Active</option><option>Inactive</option></select></div><div class="field full"><label>Description</label><textarea class="form-control" name="description" required>{{ department.description }}</textarea></div></div><div class="form-actions"><a class="btn btn-secondary" href="{% url 'departments' %}">Cancel</a><button class="btn btn-primary">Save department</button></div></div></div></form>{% endblock %}
