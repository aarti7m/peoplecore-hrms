{% extends 'hrms/base.html' %}
{% block content %}
<div class="card">
    <h2>Set new password</h2>

    {% if validlink %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Change password</button>
    </form>
    {% else %}
    <p>This password reset link is invalid or has expired.</p>
    {% endif %}
</div>
{% endblock %}
