{% extends 'hrms/base.html' %}

{% block title %}Edit Announcement | PeopleCore{% endblock %}

{% block content %}
<div class="page-head">
    <div>
        <h1>Edit Announcement</h1>
        <p>Update the announcement details.</p>
    </div>
</div>

<div class="panel">
    <form method="post">
        {% csrf_token %}

        <div class="field">
            <label>Title</label>
            {{ form.title }}
        </div>

        <div class="field" style="margin-top:14px">
            <label>Message</label>
            {{ form.message }}
        </div>

        <div class="actions" style="margin-top:20px">
            <a href="{% url 'announcements' %}" class="btn btn-secondary">
                Cancel
            </a>
            <button type="submit" class="btn btn-primary">
                Save Changes
            </button>
        </div>
    </form>
</div>
{% endblock %}
