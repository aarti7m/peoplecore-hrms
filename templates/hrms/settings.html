{% extends 'hrms/base.html' %}
{% block title %}Settings | PeopleCore{% endblock %}
{% block content %}<div class="page-head"><div><h1>Settings</h1><p>Manage your profile and preferences.</p></div></div><div data-tabs><div class="tabs"><button class="active" data-tab="#profile">Profile</button><button data-tab="#password">Change password</button><button data-tab="#notifications">Notifications</button><button data-tab="#system">System</button></div><form method="post" class="panel form-panel" data-validate>{% csrf_token %}<div class="panel-body"><div id="profile" class="tab-content active"><div class="form-grid"><div class="field"><label>Full name</label><input class="form-control" name="full_name" value="{{ user.get_full_name }}"></div><div class="field"><label>Email</label><input class="form-control" type="email" name="email" value="{{ user.email }}"></div></div></div><div id="password" class="tab-content"><div class="form-grid"><div class="field"><label>Current password</label><input class="form-control" type="password" name="current_password"></div><div class="field"><label>New password</label><input class="form-control" type="password" name="new_password"></div></div></div><div id="notifications" class="tab-content"><p><label><input type="checkbox" name="email_leave" checked> Leave request updates</label></p><p><label><input type="checkbox" name="email_announcements" checked> New announcements</label></p><p><label><input type="checkbox" name="email_attendance"> Attendance exceptions</label></p></div><div id="system" class="tab-content"><div class="form-grid"><div class="field"><label>Date format</label><select class="form-control" name="date_format"><option>DD MMM YYYY</option><option>MM/DD/YYYY</option></select></div><div class="field"><label>Timezone</label><select class="form-control" name="timezone"><option>Asia/Kolkata</option><option>UTC</option></select></div></div></div><div class="form-actions"><button class="btn btn-primary">Save changes</button></div></div></form></div>{% endblock %}
